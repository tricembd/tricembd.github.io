<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MBD-BOOK</title>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://raw.githubusercontent.com/tricembd/tricembd.github.io/main/photo.png') center center fixed;
      background-size: cover;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    #clock {
      position: fixed;
      top: clamp(10px, 2vh, 25px);
      right: clamp(10px, 2vw, 25px);
      padding: clamp(4px, 1vh, 8px) clamp(8px, 1.5vw, 16px);
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      font-size: clamp(0.7rem, 1.5vw, 1rem);
      font-weight: 600;
      z-index: 2000;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      pointer-events: none;
      color: white;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: none !important;
      transform: none !important;
    }

    .liquid-glass {
      --scale-factor: 1.0;
      --pos-x: 0px;
      --pos-y: 0px;
      width: clamp(220px, 28vw, 420px);
      min-height: clamp(260px, 35vh, 480px);
      padding: clamp(20px, 3.5vw, 40px);
      border-radius: 28px;
      isolation: isolate;
      position: relative;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      cursor: grab;
      touch-action: none;
      transition: box-shadow 300ms cubic-bezier(0.4, 0.0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      will-change: transform;
      transform: translate(var(--pos-x), var(--pos-y)) scale(var(--scale-factor));
    }

    .liquid-glass.dragging {
      cursor: grabbing;
      z-index: 1000;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.03);
      background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent 50%);
      pointer-events: none;
    }

    .liquid-glass::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: 28px;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      filter: url(#liquid-glass-distortion);
      -webkit-filter: url(#liquid-glass-distortion);
      pointer-events: none;
    }

    .profile-card-content { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; text-align: center; }
    .support-text { font-size: clamp(0.7rem, 1.2vw, 0.9rem); margin-bottom: 12px; line-height: 1.3; opacity: 0.9; margin-top: 10px; }
    .controls { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 10px; z-index: 2; }

    button {
      padding: clamp(6px, 1.2vh, 12px) clamp(12px, 2vw, 20px);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-weight: 600;
      font-size: clamp(0.75rem, 1.3vw, 0.95rem);
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: background 0.2s ease, transform 0.2s ease;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      touch-action: manipulation;
    }
    button:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.02); }
    button:active { transform: scale(0.98); }
    button:disabled { background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.4); border-color: rgba(255, 255, 255, 0.1); cursor: not-allowed; transform: none; }

    .zoom-controls { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 4px; z-index: 2; }
    .zoom-btn { width: clamp(26px, 3vw, 36px); height: clamp(26px, 3vw, 36px); border-radius: 50%; font-size: 1.1rem; padding: 0; }

    .progress-wrap {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      margin-bottom: 10px;
      height: 6px;
      overflow: hidden;
      display: none;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    .progress-wrap.active { display: block; }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.5);
      border-radius: 6px;
      transition: width 0.3s ease-out;
      position: relative;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      animation: glow-move 1.5s infinite linear;
    }

    @keyframes glow-move {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 20px; border-radius: 8px; transition: transform 0.3s ease; z-index: 3000; font-size: 0.9rem; border: 1px solid rgba(255, 255, 255, 0.2); pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    #downloadCount { font-size: clamp(0.65rem, 1.1vw, 0.8rem); text-align: center; margin-top: 8px; opacity: 0.85; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    .global-reset {
      position: fixed;
      bottom: clamp(10px, 2vh, 25px);
      left: clamp(10px, 2vw, 25px);
      padding: clamp(6px, 1.2vh, 12px) clamp(12px, 2vw, 20px);
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: white;
      font-size: clamp(0.7rem, 1.3vw, 0.9rem);
      font-weight: 600;
      cursor: pointer;
      z-index: 1000;
      width: auto;
      display: inline-block;
      transition: none !important;
      transform: none !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .global-reset:hover,
    .global-reset:active {
      background: rgba(255, 255, 255, 0.03);
      transform: none !important;
    }

    .tg-float {
      position: fixed;
      bottom: clamp(10px, 2vh, 25px);
      right: clamp(10px, 2vw, 25px);
      width: clamp(42px, 5vw, 60px);
      height: clamp(42px, 5vw, 60px);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1500;
      text-decoration: none;
      transition: none !important;
      transform: none !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .tg-float:hover,
    .tg-float:active {
      background: rgba(255, 255, 255, 0.03);
      transform: none !important;
    }
  </style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute"><defs><filter id="liquid-glass-distortion" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="92" result="noise" /><feGaussianBlur in="noise" stdDeviation="2" result="blurred" /><feDisplacementMap in="SourceGraphic" in2="blurred" scale="85" xChannelSelector="R" yChannelSelector="G" /></filter></defs></svg>

  <div id="clock">00:00</div>
  <div id="glass-card" class="liquid-glass">
    <div class="profile-card-content">
      <p class="support-text">Распространяйте книгу и делитесь ею - так вы поддерживаете автора</p>
      <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="controls">
        <button id="downloadBtn">Завладеть книгой</button>
        <button id="shareBtn">Поделиться</button>
      </div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-out">-</button>
        <button class="zoom-btn" id="zoom-in">+</button>
      </div>
      <div id="downloadCount">Скачиваний: загрузка...</div>
    </div>
  </div>

  <a href="https://t.me/+xy0UeOPWs_YyZTY6"
     class="tg-float"
     target="_blank"
     rel="noopener">
    <svg viewBox="0 0 24 24" width="55%" height="55%" fill="currentColor">
      <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
    </svg>
  </a>

  <button id="global-reset" class="global-reset">Сбросить вид</button>
  <div id="toast" class="toast"></div>

<script>
    (function() {
      'use strict';

      // Принудительное обновление страницы без кэша на всех устройствах
      if (window.performance && window.performance.navigation.type === window.performance.navigation.TYPE_BACK_FORWARD) {
        window.location.reload(true);
      }
      
      window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
          window.location.reload();
        }
      });

      const card = document.getElementById('glass-card');
      const downloadCountEl = document.getElementById('downloadCount');
      const progressWrap = document.getElementById('progressWrap');
      const progressBar = document.getElementById('progressBar');
      const toast = document.getElementById('toast');
      const downloadBtn = document.getElementById('downloadBtn');
      const shareBtn = document.getElementById('shareBtn');
      const zoomInBtn = document.getElementById('zoom-in');
      const zoomOutBtn = document.getElementById('zoom-out');
      const resetBtn = document.getElementById('global-reset');
      const clockEl = document.getElementById('clock');

      const BIN_ID = '6a832e1fda38895dfeef4161';
      const API_KEY = '$2a$10$62hvsPCaXPM84HNxUxleTOg/13GQvBx.5Vmo6JXDo1cma83WuCxYy';
      const PDF_URL = 'https://raw.githubusercontent.com/tricembd/tricembd.github.io/main/Untitled%20document.pdf';

      let scaleFactor = 1.0;
      let posX = 0, posY = 0;
      let isDragging = false, startX = 0, startY = 0;

      function updateCardTransform() {
        card.style.setProperty('--pos-x', `${posX}px`);
        card.style.setProperty('--pos-y', `${posY}px`);
        card.style.setProperty('--scale-factor', scaleFactor);
      }

      card.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        isDragging = true;
        startX = e.clientX - posX;
        startY = e.clientY - posY;
        card.classList.add('dragging');
      });

      function stopDragging() {
        if (!isDragging) return;
        isDragging = false;
        card.classList.remove('dragging');
      }

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        updateCardTransform();
      });

      window.addEventListener('pointerup', stopDragging);
      window.addEventListener('pointercancel', stopDragging);

      function adjustScale(delta) {
        scaleFactor = Math.round(Math.min(1.3, Math.max(0.7, scaleFactor + delta)) * 10) / 10;
        updateCardTransform();
      }

      zoomInBtn.addEventListener('click', (e) => { e.stopPropagation(); adjustScale(0.1); });
      zoomOutBtn.addEventListener('click', (e) => { e.stopPropagation(); adjustScale(-0.1); });

      resetBtn.addEventListener('click', () => {
        posX = 0;
        posY = 0;
        scaleFactor = 1.0;
        updateCardTransform();
      });

      async function incrementCounter() {
        try {
          const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
          });
          const data = await getRes.json();
          const newCount = (data.record.totalDownloads || 0) + 1;

          await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': API_KEY
            },
            body: JSON.stringify({ totalDownloads: newCount })
          });

          return newCount;
        } catch (e) {
          console.error("Counter update failed", e);
          return null;
        }
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }

      fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY }})
        .then(r => r.json()).then(d => downloadCountEl.textContent = `Скачиваний: ${d.record.totalDownloads || 0} раз`)
        .catch(() => downloadCountEl.textContent = 'Счётчик временно недоступен');

      if (localStorage.getItem('bookDownloaded')) {
        downloadBtn.textContent = 'Уже загружено!';
        downloadBtn.disabled = true;
      }

      downloadBtn.addEventListener('click', async () => {
        if (downloadBtn.disabled) return;
        downloadBtn.disabled = true;
        downloadBtn.textContent = 'Загрузка...';
        progressWrap.classList.add('active');
        progressBar.style.width = '40%';

        let newCount = null;
        try {
          newCount = await incrementCounter();
          progressBar.style.width = '80%';

          const response = await fetch(PDF_URL);
          if (!response.ok) throw new Error('Network response was not ok');
          const blob = await response.blob();

          progressBar.style.width = '100%';
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'MBD-BOOK.pdf';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          localStorage.setItem('bookDownloaded', 'true');
          downloadBtn.textContent = 'Уже загружено!';
          
          if (newCount !== null) {
            downloadCountEl.textContent = `Скачиваний: ${newCount} раз`;
          }

          showToast('Готово!');
        } catch (err) {
          console.warn('Fallback download triggered:', err);
          try {
            const a = document.createElement('a');
            a.href = PDF_URL;
            a.download = 'MBD-BOOK.pdf';
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            localStorage.setItem('bookDownloaded', 'true');
            downloadBtn.textContent = 'Уже загружено!';
            
            if (newCount !== null) {
              downloadCountEl.textContent = `Скачиваний: ${newCount} раз`;
            }

            showToast('Готово!');
          } catch (e2) {
            console.error(e2);
            showToast('Ошибка загрузки');
            downloadBtn.disabled = false;
            downloadBtn.textContent = 'Завладеть книгой';
          }
        } finally {
          progressWrap.classList.remove('active');
          progressBar.style.width = '0%';
        }
      });

      shareBtn.addEventListener('click', () => {
        if (navigator.share) {
          navigator.share({
            title: document.title,
            url: window.location.href
          }).catch(() => {});
        } else {
          const textToCopy = window.location.href;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textToCopy).then(() => {
              showToast('Ссылка скопирована!');
            }).catch(() => {
              fallbackCopy(textToCopy);
            });
          } else {
            fallbackCopy(textToCopy);
          }
        }
      });

      function fallbackCopy(text) {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          const successful = document.execCommand('copy');
          document.body.removeChild(textarea);
          if (successful) {
            showToast('Ссылка скопирована!');
          } else {
            showToast('Не удалось скопировать');
          }
        } catch (err) {
          showToast('Не удалось скопировать');
        }
      }

      setInterval(() => {
        clockEl.textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      }, 1000);
    })();
</script>
</body>
</html>
